workflows:
  ios-native-quick-start:
    name: MyMotivation
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: CM Key

    environment:
  ios_signing:
    distribution_type: app_store
    bundle_identifier: com.activ.motivation

  vars:
    XCODE_PROJECT: "MyMotivation.xcodeproj"
    XCODE_SCHEME: "MyMotivation"
    BUNDLE_ID: "com.activ.motivation"
    APP_STORE_APPLE_ID: "6762372863"

xcode: 16.4

scripts:
  - name: Set up provisioning profiles settings on Xcode project
    script: |
      xcode-project use-profiles

  - name: Build IPA
    script: |
      xcode-project build-ipa \
        --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
        --scheme "$XCODE_SCHEME"


    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
