workflows:
    ios-workflow:
      name: iOS Workflow1
      integrations:
        app_store_connect: CM Key
      environment:
        ios_signing:
          distribution_type: app_store
          bundle_identifier: com.activ.motivation
        vars:
          XCODE_PROJECT: "MyMotivation.xcodeproj"
          XCODE_SCHEME: "MyMotivation"
          APP_STORE_APPLE_ID: "6762372863" 
        xcode: 26.3 
        cocoapods: default
      triggering:
        events:
          - push
          - tag
          - pull_request
        branch_patterns:
          - pattern: 'develop'
            include: true
            source: true
      scripts:
        - name: Set up code signing settings on Xcode project
          script: xcode-project use-profiles --project=MyMotivation.xcodeproj
        - name: Increment build number
          script: |
            # agvtool new-version -all $(($BUILD_NUMBER + 1))
            agvtool new-version -all $(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID") + 1))
        - name: Build ipa for distribution
          script: |
            xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
      artifacts:
        - build/ios/ipa/*.ipa
        - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
      publishing:
        app_store_connect:
          # Use referenced App Store Connect API key to authenticate binary upload
          auth: integration 

          # Configuration related to TestFlight (optional)

          # Optional boolean, defaults to false. Whether or not to submit the uploaded
          # build to TestFlight beta review. Required for distributing to beta groups.
          # Note: This action is performed during post-processing.
          submit_to_testflight: true 

          # Optional boolean, defaults to false. Set to true to automatically expire 
          # previous build in review or waiting for review in Testflight before
          # submitting a new build to beta review. Expired builds will no longer be available for testers.
          # Note: This action is performed during post-processing.
          #expire_build_submitted_for_review: true
          
          # Configuration related to App Store (optional)